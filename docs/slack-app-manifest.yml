# Paste this at https://api.slack.com/apps → Create New App → From an app manifest.
# Replace APP_URL with the Vercel address (e.g. https://fomo-app-requests.vercel.app) in the three places below.
display_information:
  name: FOMO App requests
  description: Ask for a change to one of the team's apps
  background_color: "#111111"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: App requests
    always_online: true
  slash_commands:
    - command: /list-kit
      url: APP_URL/api/slack/commands
      description: Put new kit on the website (or edit a listing)
      usage_hint: "[Rentman code or part of the name]"
      should_escape: false
    - command: /grill
      url: APP_URL/api/slack/commands
      description: Sam only. Get grilled on an idea; the spec goes to Jamie
      usage_hint: "[your idea]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - channels:history
      - groups:history
      - users:read
      - users:read.email
      - im:write
      - files:read
      - files:write # Sam's grill sends Jamie the spec as a .md file (23 Nov 2026)
      - commands
      - channels:read # the Request tracker finds the channel's canvas (23 Nov 2026)
      - canvases:read
      - canvases:write
settings:
  event_subscriptions:
    request_url: APP_URL/api/slack/events
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true
    request_url: APP_URL/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
